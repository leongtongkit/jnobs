name: Release

# Builds, Developer-ID-signs, notarizes (via App Store Connect API key),
# staples, zips, and publishes Jnobs.app to a GitHub Release.
#
# Triggers on any tag matching v* (e.g. v1.0.0), or manual workflow_dispatch.
#
# Required repository secrets (same names + flow as the Iason streamer
# release pipeline, so the same 6 values work here):
#   MAC_CERT_P12_BASE64       base64 of Developer ID Application .p12
#   MAC_CERT_PASSWORD         password set when exporting the .p12
#   APPLE_API_KEY_P8_BASE64   base64 of the App Store Connect .p8 private key
#   APPLE_API_KEY_ID          ASC API Key ID
#   APPLE_API_ISSUER          ASC Issuer ID
#   APPLE_TEAM_ID             10-character Apple Team ID

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # to create the GitHub Release

jobs:
  release:
    name: build · sign · notarize · publish
    runs-on: macos-15
    timeout-minutes: 90  # Apple's notary queue can sit at 30+ min during busy periods

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      # --- Import Developer ID cert into a fresh, ephemeral keychain ---
      # Dies with the runner; never touches the login keychain.
      - name: Import Developer ID certificate
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD:   ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN=build.keychain
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN
          security set-keychain-settings -lut 21600 $KEYCHAIN
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN

          echo "$MAC_CERT_P12_BASE64" | base64 --decode > /tmp/cert.p12
          security import /tmp/cert.p12 -k $KEYCHAIN \
            -P "$MAC_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f /tmp/cert.p12

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN

          security list-keychains -d user -s $KEYCHAIN login.keychain
          security default-keychain -s $KEYCHAIN

          echo "Identities in build keychain:"
          security find-identity -p codesigning -v $KEYCHAIN

      # --- Stage the App Store Connect API .p8 for notarytool ---
      - name: Stage ASC API key
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID:        ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode \
            > ~/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8

      # --- Build (build_app.sh ad-hoc signs; we re-sign with Developer ID next) ---
      - name: Build app
        working-directory: app
        run: ./build_app.sh --release

      # --- Re-sign with Developer ID + hardened runtime + secure timestamp ---
      # Identity is derived from the keychain at runtime so no extra secret
      # is needed beyond the cert itself.
      - name: Re-sign with Developer ID
        run: |
          set -euo pipefail
          APP="app/Jnobs.app"
          IDENTITY="$(security find-identity -p codesigning -v build.keychain \
            | awk -F'"' '/Developer ID Application/ {print $2; exit}')"
          if [ -z "$IDENTITY" ]; then
            echo "No Developer ID Application identity found in build keychain"
            security find-identity -p codesigning -v build.keychain
            exit 1
          fi
          echo "Signing with: $IDENTITY"
          codesign --force --deep \
            --options runtime \
            --timestamp \
            --sign "$IDENTITY" \
            "$APP"

      # --- Zip + submit to Apple's notary service ---
      - name: Zip for notarization
        run: ditto -c -k --keepParent app/Jnobs.app /tmp/Jnobs.zip

      - name: Notarize via App Store Connect API
        timeout-minutes: 75   # Apple's notary queue can be very slow; see 2026-05-23 incident
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          xcrun notarytool submit /tmp/Jnobs.zip \
            --key ~/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8 \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait

      - name: Staple notarization ticket
        run: xcrun stapler staple app/Jnobs.app

      # Re-zip the now-stapled .app so users get an offline-verifiable bundle.
      - name: Re-zip stapled app
        run: |
          rm -f /tmp/Jnobs.zip
          ditto -c -k --keepParent app/Jnobs.app /tmp/Jnobs.zip

      # --- Apple's prescribed verification chain ---
      - name: Verify per Apple's notarization rules
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          APP="app/Jnobs.app"

          echo "--- codesign --verify --deep --strict ---"
          codesign --verify --deep --strict --verbose=2 "$APP"

          echo "--- codesign -dvvv ---"
          codesign -dvvv "$APP" 2>&1 | tee /tmp/csinfo.txt
          grep -q "TeamIdentifier=${APPLE_TEAM_ID}" /tmp/csinfo.txt \
            || { echo "TeamIdentifier mismatch — want ${APPLE_TEAM_ID}"; exit 1; }
          grep -q "flags=0x10000(runtime)" /tmp/csinfo.txt \
            || { echo "Hardened Runtime not enabled"; exit 1; }
          grep -q "Authority=Developer ID Application" /tmp/csinfo.txt \
            || { echo "Wrong signing authority"; exit 1; }

          echo "--- spctl --assess (Gatekeeper) ---"
          spctl --assess -vv --type execute "$APP"

          echo "--- stapler validate ---"
          xcrun stapler validate -v "$APP"

          echo "--- ALL APPLE CHECKS PASSED ---"

      # --- Publish to GitHub Releases ---
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF##refs/tags/}"
          gh release create "$TAG" /tmp/Jnobs.zip \
            --title "Jnobs $TAG" \
            --generate-notes \
            --verify-tag
