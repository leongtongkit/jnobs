<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Fire Jnobs Button</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 12px;
               color: #FFF; background: #2D2D2D; margin: 0; padding: 14px; }
        label { display: block; margin: 0 0 4px; color: #B6B6B6; }
        select { width: 100%; padding: 6px; background: #3D3D3D; color: #FFF;
                 border: 1px solid #555; border-radius: 4px; font-size: 12px; }
        .hint { font-size: 11px; color: #888; margin-top: 8px; line-height: 1.4; }
    </style>
</head>
<body>
    <label for="buttonIndex">Jnobs button</label>
    <select id="buttonIndex">
        <option value="0">Button 1</option>
        <option value="1">Button 2</option>
        <option value="2">Button 3</option>
        <option value="3">Button 4</option>
        <option value="4">Button 5</option>
    </select>
    <p class="hint">Triggers the short-tap action you've bound to this Jnobs button.</p>
    <script>
        let websocket = null;
        let context = '';
        let actionInfo = null;
        const sel = document.getElementById('buttonIndex');

        function connectElgatoStreamDeckSocket(inPort, inUUID, inRegisterEvent, inInfo, inActionInfo) {
            context = inUUID;
            actionInfo = JSON.parse(inActionInfo);
            const current = (actionInfo.payload && actionInfo.payload.settings &&
                             actionInfo.payload.settings.buttonIndex);
            if (current !== undefined) sel.value = String(current);
            websocket = new WebSocket('ws://127.0.0.1:' + inPort);
            websocket.onopen = () => {
                websocket.send(JSON.stringify({ event: inRegisterEvent, uuid: inUUID }));
            };
        }

        sel.addEventListener('change', () => {
            websocket.send(JSON.stringify({
                event: 'setSettings',
                context: context,
                payload: { buttonIndex: parseInt(sel.value, 10) }
            }));
        });
    </script>
</body>
</html>
